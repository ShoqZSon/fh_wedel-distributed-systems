syntax = "proto3";

package database;

// Operation types
enum OperationType {
  GET_RECORD = 0;
  ADD_RECORD = 1;
  GET_SIZE = 2;
}

// Request message
message DBRequest {
  OperationType operation = 1;

  // Optional fields depending on the operation
  int32 index = 2;       // for GET_RECORD or ADD_RECORD
  string record = 3;     // for ADD_RECORD
}

// Response message
message DBResponse {
  bool success = 1;      // indicates if operation succeeded
  string record = 2;     // for GET_RECORD
  int32 size = 3;        // for GET_SIZE
  string error = 4;      // optional error message
}
