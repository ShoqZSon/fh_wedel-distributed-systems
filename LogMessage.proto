syntax = "proto3";

package logserver;

// Enum for severity levels
enum SeverityLevel {
  DEBUG = 0;
  INFO = 1;
  WARN = 2;
  ERROR = 3;
  FATAL = 4;
}

// Message definition for a log entry
message LogMessage {
  // Timestamp when the log entry was created
  int64 timestamp = 1;

  // Optional indicator of the source/creator of the log
  string source = 2;

  // Severity level
  SeverityLevel severity = 3;

  // Body of the log message
  string message = 4;
}
